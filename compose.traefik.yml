# Traefik Labels Override for Support Library
#
# Usage:
#   docker compose -f compose.yml -f compose.traefik.yml up -d
#
# Requires Traefik v3+ with:
#   - Entry points: web (port 80), websecure (port 443)
#   - TLS certificate resolver named "mytlschallenge" (or change below)
#   - Docker provider enabled with access to Docker socket
#
# Customize the following for your domain:
#   - traefik.http.routers.support-library.rule: Host(`your-domain.com`)
#   - traefik.http.routers.support-library.tls.certresolver: your-resolver

services:
  support-library:
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.support-library.rule=Host(`support.your-domain.com`)
      - traefik.http.routers.support-library.entrypoints=websecure
      - traefik.http.routers.support-library.tls=true
      - traefik.http.routers.support-library.tls.certresolver=mytlschallenge
      - traefik.http.routers.support-library.middlewares=support-library-rate-limit
      - traefik.http.middlewares.support-library-rate-limit.ratelimit.average=60
      - traefik.http.middlewares.support-library-rate-limit.ratelimit.period=1s
      - traefik.http.middlewares.support-library-rate-limit.ratelimit.burst=120
      # Health check rate limiting (stricter: 10 req/min per IP)
      - traefik.http.middlewares.support-library-health-rate-limit.ratelimit.average=10
      - traefik.http.middlewares.support-library-health-rate-limit.ratelimit.period=1m
      - traefik.http.middlewares.support-library-health-rate-limit.ratelimit.burst=20
      - traefik.http.routers.support-library-health.rule=Host(`support.your-domain.com`) && PathPrefix(`/api/health`)
      - traefik.http.routers.support-library-health.entrypoints=websecure
      - traefik.http.routers.support-library-health.priority=100
      - traefik.http.routers.support-library-health.tls=true
      - traefik.http.routers.support-library-health.tls.certresolver=mytlschallenge
      - traefik.http.routers.support-library-health.middlewares=support-library-health-rate-limit
      - traefik.http.routers.support-library-health.service=support-library
      - traefik.http.services.support-library.loadbalancer.server.port=12000

networks:
  proxy:
    external: true
    name: proxy
