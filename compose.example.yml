# Support Library - Generic Docker Compose Configuration
#
# This is an example configuration for self-hosting. Copy this file to
# compose.yml and customize for your environment.
#
# For production with Traefik reverse proxy, also use compose.traefik.yml:
#   docker compose -f compose.yml -f compose.traefik.yml up -d
#
# Required environment variables (see .env.example):
#   MONGODB_URI, MONGODB_DB, LMS_MONGODB_URI, LMS_MONGODB_DB
#   AUTH_SECRET, AUTH_GOOGLE_ID, AUTH_GOOGLE_SECRET, AUTH_URL, AUTH_TRUST_HOST
#   NEXT_PUBLIC_APP_URL, NODE_ENV, ALLOW_INSECURE_LINKS, ALLOWED_LINK_HOSTS, MAX_LINKS_PER_ITEM

name: support-library

services:
  support-library:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: support-library
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "12000"
    expose:
      - "12000"
    # networks:
    #   - support_library_network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:12000/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=1770
      - /app/.next/cache:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0750
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    cpus: 1.0
    mem_limit: 1g
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  ops:
    build:
      context: .
      dockerfile: Dockerfile
      target: ops
    env_file:
      - .env.production
    command: ["sh", "-c", "exit 0"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: 0.5
    mem_limit: 512m
    stop_grace_period: 10s

