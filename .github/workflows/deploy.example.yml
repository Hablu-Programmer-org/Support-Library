      #       'cd /opt/support-library && docker compose -f compose.yml --env-file .env.production up -d --build --force-recreate'

      # --- Option B: Vercel ---
      # - name: Deploy to Vercel
      #   uses: amondnet/vercel-action@v25
      #   with:
      #     vercel-token: ${{ secrets.VERCEL_TOKEN }}
      #     vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
      #     vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
      #     vercel-args: '--prod'

      # --- Option C: Railway ---
      # - name: Deploy to Railway
      #   uses: railway-actions/deploy@v1
      #   with:
      #     token: ${{ secrets.RAILWAY_TOKEN }}
      #     service: 'support-library'

      # --- Option D: Render ---
      # - name: Deploy to Render
      #   uses: render-actions/deploy@v1
      #   with:
      #     api-key: ${{ secrets.RENDER_API_KEY }}
      #     service-id: ${{ secrets.RENDER_SERVICE_ID }}

      # ============================================================
      # POST-DEPLOYMENT VERIFICATION (customize for your domain)
      # ============================================================
      - name: Health check
        run: |
          DOMAIN="${{ vars.PRODUCTION_DOMAIN || 'your-domain.com' }}"
          for i in $(seq 1 40); do
            code=$(curl -fsS -o /dev/null -w "%{http_code}" "https://$DOMAIN/api/health/ready" || true)
            if [ "$code" = "200" ]; then
              echo "Deploy healthy (HTTP $code)"
              exit 0
            fi
            echo "Waiting for health... (HTTP $code)"
            sleep 5
          done
          echo "Health check failed after 40 attempts (last HTTP $code)"
          exit 1