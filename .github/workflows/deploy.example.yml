# Generic Deploy Workflow Example
#
# This is an example deployment workflow. Copy to deploy.yml and customize for your target.
# Supported targets: VPS (SSH), Vercel, Railway, Render, Coolify, etc.
#
# Required GitHub Secrets (adjust for your target):
#   For VPS: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_SSH_KNOWN_HOSTS
#   For Vercel: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   For Railway: RAILWAY_TOKEN
#   For Render: RENDER_API_KEY, RENDER_SERVICE_ID
#
# The workflow runs after CI passes and requires manual approval (environment protection).

name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: support-library-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # ============================================================
      # DEPLOYMENT TARGET: Choose ONE section below and customize
      # ============================================================

      # --- Option A: VPS via SSH (example) ---
      # - name: Configure SSH
      #   env:
      #     VPS_HOST: ${{ secrets.VPS_HOST }}
      #     VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      #   run: |
