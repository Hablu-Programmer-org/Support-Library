      #
      # - name: Sync files to VPS
      #   env:
      #     VPS_HOST: ${{ secrets.VPS_HOST }}
      #     VPS_USER: ${{ secrets.VPS_USER }}
      #   run: |
      #     rsync -az \
      #       --exclude='.git' \
      #       --exclude='.github' \
      #       --exclude='node_modules' \
      #       --exclude='.next' \
      #       --exclude='logs' \
      #       --exclude='.env' \
      #       --exclude='.env.*' \
      #       -e "ssh -i ~/.ssh/id_deploy" \
      #       ./ "$VPS_USER@$VPS_HOST:/opt/support-library/"
      #
      # - name: Build and restart on VPS
      #   env:
