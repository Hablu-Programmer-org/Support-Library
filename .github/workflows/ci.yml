name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: support-library-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and production E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
      MONGODB_DB: support_library_ci_dev
      MONGODB_TEST_DB: support_library_ci_e2e
      LMS_MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
      LMS_MONGODB_DB: support_library_ci_e2e
      E2E_ALLOW_DATABASE_RESET: "true"
      AUTH_SECRET: ci-only-not-a-production-secret-ci-only
      AUTH_TRUST_HOST: "true"
      AUTH_URL: http://127.0.0.1:12001
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:12001
      AUTH_GOOGLE_ID: ci.invalid.apps.googleusercontent.com
      AUTH_GOOGLE_SECRET: ci-only-placeholder
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
          cache: npm

      - name: Start transaction-capable MongoDB
        shell: bash
        run: |
          docker run --detach --name support-library-ci-mongo --publish 27017:27017 \
            mongo:8.0.15-noble --replSet rs0 --bind_ip_all
          for attempt in {1..30}; do
            if docker exec support-library-ci-mongo mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' >/dev/null 2>&1; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              docker logs support-library-ci-mongo
              exit 1
            fi
            sleep 2
          done
          docker exec support-library-ci-mongo mongosh --quiet --eval \
            'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in {1..30}; do
            if docker exec support-library-ci-mongo mongosh --quiet --eval \
              'if (!db.hello().isWritablePrimary) quit(1)' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs support-library-ci-mongo
          exit 1

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production E2E
        shell: bash
        run: |
          config=playwright.12001.config.ts
          if [[ -f playwright.ci.config.ts ]]; then
            config=playwright.ci.config.ts
          fi
          npx playwright test --config="$config"

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
