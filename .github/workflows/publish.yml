name: Publish GHCR image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: support-library-publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out verified revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Normalize GHCR image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hablu-support-library" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish exact SHA tag
        id: runtime
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ./Dockerfile
          target: runner
          platforms: linux/amd64
          build-args: DEPLOYMENT_VERSION=${{ env.SOURCE_SHA }}
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Build and publish ops (migration) image
        id: ops
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ./Dockerfile
          target: ops
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ env.SOURCE_SHA }}-ops
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record verified release metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          digest="${{ steps.runtime.outputs.digest }}"
          ops_digest="${{ steps.ops.outputs.digest }}"
          [[ "$digest" == sha256:* ]] || { echo "Missing runtime image digest." >&2; exit 1; }
          [[ "$ops_digest" == sha256:* ]] || { echo "Missing ops image digest." >&2; exit 1; }
          printf 'sha=%s\ndigest=%s\nopsdigest=%s\n' "$SOURCE_SHA" "$digest" "$ops_digest" > release.env
          cat release.env

      - name: Upload release metadata
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: release-metadata
          path: release.env
          retention-days: 90
          if-no-files-found: error
