name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: support-library-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync files to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='logs' \
            --exclude='.env' \
            --exclude='.env.*' \
            -e "ssh -i ~/.ssh/id_deploy" \
            ./ "$VPS_USER@$VPS_HOST:/opt/hablu-support-library/"

      - name: Pre-deploy environment check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" \
            'test -f /opt/hablu-support-library/shared/.env.production || { echo "ERROR: /opt/hablu-support-library/shared/.env.production missing on VPS"; exit 1; }'

      - name: Build and restart
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" \
            'cp /opt/hablu-support-library/shared/.env.production /opt/hablu-support-library/.env.production && cd /opt/hablu-support-library && docker compose -f compose.production.yml --env-file .env.production up -d --build --force-recreate'

      - name: Apply indexes and preflight
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" \
            'cp /opt/hablu-support-library/shared/.env.production /opt/hablu-support-library/.env.production && cd /opt/hablu-support-library && docker compose -f compose.production.yml --env-file .env.production run --rm ops npm run db:indexes -- --apply --create-only && docker compose -f compose.production.yml --env-file .env.production run --rm ops npm run db:indexes -- --verify && docker compose -f compose.production.yml --env-file .env.production run --rm ops npm run db:preflight'

      - name: Cleanup old Docker images
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" \
            'docker image prune -f'

      - name: Health check
        run: |
          for i in $(seq 1 40); do
            code=$(curl -fsS -o /dev/null -w "%{http_code}" https://support.hablu-programmer.com/api/health/ready || true)
            if [ "$code" = "200" ]; then
              echo "Deploy healthy (HTTP $code)"
              exit 0
            fi
            echo "Waiting for health... (HTTP $code)"
            sleep 5
          done
          echo "Health check failed after 40 attempts (last HTTP $code)"
          exit 1