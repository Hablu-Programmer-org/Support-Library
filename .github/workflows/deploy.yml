name: Deploy production

on:
  workflow_run:
    workflows: [Publish GHCR image]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Deploy a published artifact or roll back to the recorded previous image
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - rollback
      publish_run_id:
        description: Successful Publish GHCR image run ID (required for deploy)
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: support-library-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Approval-gated digest deployment
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - name: Resolve trusted publish run
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_ACTION: ${{ inputs.action }}
          INPUT_RUN_ID: ${{ inputs.publish_run_id }}
        run: |
          set -euo pipefail
          action="deploy"
          run_id="$EVENT_RUN_ID"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            action="$EVENT_ACTION"
            run_id="$INPUT_RUN_ID"
          fi
          echo "action=$action" >> "$GITHUB_OUTPUT"
          if [[ "$action" == "rollback" ]]; then
            [[ -z "$run_id" ]] || echo "publish_run_id is ignored for rollback"
            exit 0
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "publish_run_id is required for deploy"; exit 1; }
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .conclusion)
          workflow_path=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .path)
          branch=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .head_branch)
          [[ "$conclusion" == "success" && "$workflow_path" == ".github/workflows/publish.yml" && "$branch" == "main" ]] || {
            echo "Run must be a successful publish.yml run on main"
            exit 1
          }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download exact release artifact
        if: steps.release.outputs.action == 'deploy'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.release.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-metadata --dir release
          cd release
          sha256sum --check SHA256SUMS
          set -a
          source release.env
          set +a
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APP_IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
          [[ "$OPS_IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]

      - name: Configure trusted SSH host
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null
          [[ -n "$VPS_SSH_KNOWN_HOSTS" ]] || { echo "VPS_SSH_KNOWN_HOSTS is required"; exit 1; }
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy exact Compose artifact
        if: steps.release.outputs.action == 'deploy'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
        run: scp -P "$VPS_SSH_PORT" -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes release/compose.production.yml "$VPS_USER@$VPS_HOST:/tmp/hablu-support-library-compose.yml"

      - name: Deploy or roll back on VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
          DEPLOY_ACTION: ${{ steps.release.outputs.action }}
        run: |
          set -euo pipefail
          release_sha=""
          app_image=""
          ops_image=""
          if [[ "$DEPLOY_ACTION" == "deploy" ]]; then
            set -a
            source release/release.env
            set +a
            release_sha="$RELEASE_SHA"
            app_image="$APP_IMAGE"
            ops_image="$OPS_IMAGE"
          fi
          ssh -p "$VPS_SSH_PORT" -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" bash -s -- "$DEPLOY_ACTION" "$release_sha" "$app_image" "$ops_image" <<'REMOTE'
          set -euo pipefail
          action="$1"
          release_sha="$2"
          app_image="$3"
          ops_image="$4"
          root=/opt/hablu-support-library
          shared="$root/shared"
          state="$root/state"
          env_file="$shared/.env.production"
          project=hablu-support-library

          test -r "$env_file"
          test "$(stat -c '%a' "$env_file")" = "600"
          docker network inspect root_default >/dev/null
          install -d -m 750 "$root/releases" "$state"

          write_state() {
            name="$1"
            value="$2"
            tmp="$state/.$name.$$"
            printf '%s\n' "$value" > "$tmp"
            chmod 600 "$tmp"
            mv -f "$tmp" "$state/$name"
          }

          wait_healthy() {
            # Read the worker presence straight from the compose file: calling
            # `docker compose ps` here needs APP_IMAGE/OPS_IMAGE interpolation
            # and would silently return nothing, which made every deploy time
            # out (and the old pre-worker release un-rollbackable).
            has_worker=false
            if grep -qE '^  access-email-worker:' "$active_compose" 2>/dev/null; then
              has_worker=true
            fi
            for attempt in $(seq 1 40); do
              web_status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' hablu-support-library 2>/dev/null || true)
              worker_id=$(docker ps -q --filter "label=com.docker.compose.project=$project" --filter "label=com.docker.compose.service=access-email-worker" | head -1 || true)
              worker_status=""
              if [ -n "$worker_id" ]; then
                worker_status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$worker_id" 2>/dev/null || true)
              fi
              worker_ok=false
              if [ "$has_worker" = true ]; then
                if [ "$worker_status" = healthy ]; then worker_ok=true; fi
              else
                worker_ok=true
              fi
              if [ "$web_status" = healthy ] && [ "$worker_ok" = true ] && curl --fail --silent https://support.hablu-programmer.com/api/health/ready >/dev/null; then
                return 0
              fi
              sleep 5
            done
            docker logs --tail 100 hablu-support-library || true
            if [ -n "${worker_id:-}" ]; then docker logs --tail 100 "$worker_id" || true; fi
            return 1
          }

          run_compose() {
            compose_file="$1"
            app="$2"
            ops="$3"
            # A rollback target predates the worker and must still be able to
            # bring the site back; a candidate release must always ship it.
            require_worker="${4:-true}"
            active_compose="$compose_file"
            services="support-library"
            if APP_ENV_FILE="$env_file" APP_IMAGE="$app" OPS_IMAGE="$ops" \
              docker compose -p "$project" -f "$compose_file" config --services 2>/dev/null \
              | grep -qx access-email-worker; then
              services="support-library access-email-worker"
            elif [ "$require_worker" = true ]; then
              # A release without the worker would accept decisions but never
              # deliver them, so refuse instead of leaving jobs orphaned.
              echo "Compose file $compose_file has no access-email-worker service" >&2
              return 1
            else
              echo "warning: $compose_file has no access-email-worker; starting the app only" >&2
            fi
            APP_ENV_FILE="$env_file" APP_IMAGE="$app" OPS_IMAGE="$ops" \
              docker compose -p "$project" -f "$compose_file" up -d --no-build --force-recreate $services
          }

          if [ "$action" = rollback ]; then
            test -s "$state/previous-app-image"
            test -s "$state/previous-ops-image"
            test -s "$state/previous-release"
            previous_app_image=$(cat "$state/previous-app-image")
            previous_ops_image=$(cat "$state/previous-ops-image")
            previous_release=$(cat "$state/previous-release")
            previous_compose="$root/releases/$previous_release/compose.production.yml"
            test -f "$previous_compose"
            docker pull "$previous_app_image"
            docker pull "$previous_ops_image"
            old_app_image=$(cat "$state/current-app-image")
            old_ops_image=$(cat "$state/current-ops-image")
            old_release=$(cat "$state/current-release")
            run_compose "$previous_compose" "$previous_app_image" "$previous_ops_image" false
            wait_healthy
            write_state previous-app-image "$old_app_image"
            write_state previous-ops-image "$old_ops_image"
            write_state previous-release "$old_release"
            write_state current-app-image "$previous_app_image"
            write_state current-ops-image "$previous_ops_image"
            write_state current-release "$previous_release"
            exit 0
          fi

          release_dir="$root/releases/$release_sha"
          install -d -m 750 "$release_dir"
          install -m 640 /tmp/hablu-support-library-compose.yml "$release_dir/compose.production.yml"
          rm -f /tmp/hablu-support-library-compose.yml
          compose_file="$release_dir/compose.production.yml"

          # Pull before touching any container so a registry failure aborts cleanly
          # (the rollback trap is armed later, once a change is imminent).
          if ! docker pull "$app_image"; then
            echo "Failed to pull the application image: $app_image" >&2
            echo "If Docker reported 'manifest unknown', this host is not authenticated" >&2
            echo "to GHCR for a private package (GHCR returns 404 for private manifests)." >&2
            echo "Create a read:packages token for the package owner and log in once as the" >&2
            echo "deploy user: docker login ghcr.io -u <github-user> --password-stdin" >&2
            exit 1
          fi
          if ! docker pull "$ops_image"; then
            echo "Failed to pull the operations image: $ops_image" >&2
            echo "See the GHCR authentication note above." >&2
            exit 1
          fi
          docker image inspect "$app_image" >/dev/null
          docker image inspect "$ops_image" >/dev/null

          docker run --rm --env-file "$env_file" --network root_default --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m \
            --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges "$ops_image" npm run worker:access-email -- --check

          docker run --rm --env-file "$env_file" --network root_default --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --cap-drop ALL --security-opt no-new-privileges "$ops_image" npm run db:indexes -- --apply --create-only
          docker run --rm --env-file "$env_file" --network root_default --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --cap-drop ALL --security-opt no-new-privileges "$ops_image" npm run db:indexes -- --verify
          docker run --rm --env-file "$env_file" --network root_default --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --cap-drop ALL --security-opt no-new-privileges "$ops_image" npm run db:preflight

          old_app_image=$(cat "$state/current-app-image" 2>/dev/null || cat "$state/current-image" 2>/dev/null || docker inspect --format '{{.Config.Image}}' hablu-support-library 2>/dev/null || true)
          old_ops_image=$(cat "$state/current-ops-image" 2>/dev/null || true)
          old_release=$(cat "$state/current-release" 2>/dev/null || true)
          rollback_compose="$compose_file"
          if [ -n "$old_release" ] && [ -f "$root/releases/$old_release/compose.production.yml" ]; then
            rollback_compose="$root/releases/$old_release/compose.production.yml"
          fi
          rollback() {
            if [ -n "$old_app_image" ] && [ -n "$old_ops_image" ]; then
              # Service first: an old release without the worker must still be
              # able to restore the site.
              run_compose "$rollback_compose" "$old_app_image" "$old_ops_image" false || true
              wait_healthy || true
            else
              APP_ENV_FILE="$env_file" APP_IMAGE="$app_image" OPS_IMAGE="$ops_image" \
                docker compose -p "$project" -f "$compose_file" stop support-library access-email-worker || true
            fi
          }
          trap rollback ERR
          run_compose "$compose_file" "$app_image" "$ops_image"
          wait_healthy
          trap - ERR

          if [ -n "$old_app_image" ] && [ -n "$old_ops_image" ]; then
            write_state previous-app-image "$old_app_image"
            write_state previous-ops-image "$old_ops_image"
            write_state previous-release "${old_release:-$release_sha}"
          fi
          write_state current-app-image "$app_image"
          write_state current-ops-image "$ops_image"
          write_state current-release "$release_sha"
          docker image prune -f >/dev/null
          REMOTE
