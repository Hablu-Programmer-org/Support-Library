version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    # Auto-merge security patches
    allow:
      - dependency-type: "direct"
        update-type: "security"
    assignees:
      - "maintainer-username"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "direct"
        update-type: "security"
    assignees:
      - "maintainer-username"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "direct"
        update-type: "security"
    assignees:
      - "maintainer-username"